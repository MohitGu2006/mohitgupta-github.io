<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit Gupta | Link in Bio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-canvas: #dcd6f7;
            --card-surface: #ffffff;
            --border-jet: #0a0a0a;
            
            --insta-bg: #ff2a85;
            --telegram-bg: #0088cc;
            --youtube-bg: #ff0033;
            --github-bg: #24292e;
            --twitter-bg: #000000;
            --whatsapp-bg: #25d366;
            
            --shadow-brutal: 4px 4px 0px var(--border-jet);
            --shadow-hover: 1px 1px 0px var(--border-jet);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-canvas);
            background-image: 
                linear-gradient(45deg, rgba(10, 10, 10, 0.05) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(10, 10, 10, 0.05) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, rgba(10, 10, 10, 0.05) 75%), 
                linear-gradient(-45deg, transparent 75%, rgba(10, 10, 10, 0.05) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--border-jet);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-surface);
            border: 3px solid var(--border-jet);
            box-shadow: 8px 8px 0px var(--border-jet);
            position: relative;
            overflow: hidden;
        }

        /* Top Window OS Bar */
        .window-bar {
            background: var(--border-jet);
            color: #ffffff;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-jet);
        }

        .window-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid #ffffff;
            display: inline-block;
        }

        .dot-1 { background: #ff579f; }
        .dot-2 { background: #ffde00; }
        .dot-3 { background: #00f59b; }

        .window-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #00f59b;
        }

        .content-body {
            padding: 20px 18px;
        }

        /* Live Status Badge */
        .status-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #00f59b;
            border: 3px solid var(--border-jet);
            box-shadow: 4px 4px 0px var(--border-jet);
            padding: 7px 10px;
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .status-badge i {
            font-size: 0.6rem;
            color: #008542;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Profile Section */
        .profile-section {
            text-align: center;
            margin-bottom: 18px;
        }

        .avatar-wrapper {
            width: 88px;
            height: 88px;
            margin: 0 auto 14px;
            background: #ffde00;
            border: 3px solid var(--border-jet);
            box-shadow: 5px 5px 0px var(--border-jet);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 1.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .handle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ff579f;
            color: #ffffff;
            border: 2px solid var(--border-jet);
            box-shadow: 3px 3px 0px var(--border-jet);
            padding: 3px 12px;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            margin-bottom: 16px;
        }

        .bio-box {
            background: #ffde00;
            border: 3px solid var(--border-jet);
            padding: 12px 10px;
            box-shadow: 4px 4px 0px var(--border-jet);
        }

        .bio-roles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .role-pill {
            background: #ffffff;
            border: 2px solid var(--border-jet);
            padding: 5px 10px;
            font-size: 0.78rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 3px 3px 0px var(--border-jet);
        }

        /* Social Links Stack */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            border: 3px solid var(--border-jet);
            box-shadow: var(--shadow-brutal);
            min-height: 56px;
            padding: 8px 12px;
            font-weight: 900;
            font-size: 0.98rem;
            text-transform: uppercase;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .link-card:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 3px;
        }

        @media (hover: hover) and (pointer: fine) {
            .link-card:hover {
                transform: translate(4px, 4px);
                box-shadow: var(--shadow-hover);
            }
        }

        .link-card:active {
            transform: translate(5px, 5px);
            box-shadow: 0px 0px 0px var(--border-jet);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-box {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            background: #ffffff;
            border: 2px solid var(--border-jet);
            box-shadow: 2px 2px 0px var(--border-jet);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .arrow-box {
            width: 30px;
            height: 30px;
            flex: 0 0 30px;
            background: #ffffff;
            color: var(--border-jet);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            border: 2px solid var(--border-jet);
            box-shadow: 2px 2px 0px var(--border-jet);
        }

        /* Exact Brand Matched Neo-Brutalist Colors */
        .card-instagram { background-color: var(--insta-bg); color: var(--border-jet); }
        .card-instagram .icon-box { color: #ff2a85; }

        .card-telegram { background-color: var(--telegram-bg); color: var(--border-jet); }
        .card-telegram .icon-box { color: #0088cc; }

        .card-youtube { background-color: var(--youtube-bg); color: var(--border-jet); }
        .card-youtube .icon-box { color: #ff0033; }

        .card-github { background-color: var(--github-bg); color: #ffffff; }
        .card-github .icon-box { color: #24292e; }

        .card-twitter { background-color: var(--twitter-bg); color: #ffffff; }
        .card-twitter .icon-box { color: #000000; }

        .card-whatsapp { background-color: var(--whatsapp-bg); color: var(--border-jet); }
        .card-whatsapp .icon-box { color: #25d366; }

        /* Footer */
        .footer {
            margin-top: 18px;
            background: var(--border-jet);
            color: #ffffff;
            padding: 10px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            border: 3px solid var(--border-jet);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .footer i {
            color: #00f59b;
        }

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 14px 12px 20px;
            }

            .container {
                max-width: 400px;
                margin: 0 auto;
            }
        }

        @media (max-width: 380px) {
            .content-body {
                padding: 16px 12px;
            }

            .status-badge {
                font-size: 0.62rem;
                gap: 6px;
            }

            .role-pill {
                padding: 5px 8px;
                font-size: 0.72rem;
            }

            .link-card {
                padding: 8px 10px;
                font-size: 0.9rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

</html>
