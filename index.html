<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link - Social Media Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <div class="geometric-shape-1"></div>
        <div class="geometric-shape-2"></div>
        <div class="geometric-shape-3"></div>
    </div>



    <!-- Main Content -->
    <div class="container">
        <div class="profile-card">
            <!-- Profile Section -->
            <div class="profile-section">
                <div class="profile-image">
                    <img src="./photo_2025-07-18_15-36-26_1752833198071.jpg"
                        alt="Mohit Gupta Profile Picture" id="profileImg">
                </div>
                <h1 class="profile-name">Mohit Gupta</h1>
                <p class="profile-bio">Content Creator | Educator | Explorer</p>
            </div>

            <!-- Social Links -->
            <div class="social-links">
                <a href="https://youtube.com/@mgaiworld?si=rP-_7tWdlEJMWdxa" class="social-link youtube"
                    target="_blank">
                    <i class="fab fa-youtube"></i>
                    <span>YouTube</span>
                </a>

                <a href="https://instagram.com/mohit_gupta_2006" class="social-link instagram" target="_blank">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </a>

                <a href="https://t.me/UnlockedHub" class="social-link telegram" target="_blank">
                    <i class="fab fa-telegram"></i>
                    <span>Telegram</span>
                </a>

                <a href="mailto:mohtgupta2006@gmail.com?subject=Hello%20Mohit&body=Hi%20Mohit,%20I%20found%20your%20profile%20and%20would%20like%20to%20connect." class="social-link email" target="_blank">
                    <i class="fas fa-envelope"></i>
                    <span>Email</span>
                </a>

                <a href="https://mohitgu2006.github.io/ResumeGenerator-github.io/" class="social-link website"
                    target="_blank">
                    <i class="fas fa-globe"></i>
                    <span>Website</span>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Powered by <span class="creator-name">Mohit Gupta</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
